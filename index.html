<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bestell App</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/34f6182fea.js" crossorigin="anonymous"></script>

</head>
<body>
    <header>
        <nav>
            <div class="nav-logo">
                <img src="./assets/img/icon.png">
            </div>
            <div class="burger-menu-button">
                <i class="fa-solid fa-bars"></i>
            </div>
        </nav>
        <div class="hero-banner-container">
            <img class="hero-banner-img" src="./assets/img/hero_banner.jpg">
        </div>
        <div class="header-infos-wrapper">
            <div class="burger-header-logo">
                <img class="burger-logo" src="./assets/img/burger/burger_logo.png">
            </div>
            <div class="header-infos">
                <div class="headline-rating-wrapper">
                    <div class="headline">
                        <span class="header1">Burger</span>
                        <p>House</p>
                    </div>
                    <div class="rating">
                        <p><i class="fa-solid fa-star"></i> 4,1 (317)</p>
                    </div>
                </div>
                <div class="info">
                    <p>The best of Burgers, Pizza and Greens, all in one great place.</p>
                </div>
            </div>
        </div>
    </header>
    <main>
        <section>
            <div class="section-header">
                <div class="img-wrapper">
                    <img class="section-img" src="./assets/img/burger/burger_icon.png">
                </div>
                <div class="header-wrapper">
                    <h2>Burger & Sandwiches</h2>
                </div>
            </div>
            <div class="articles-wrapper">
                <article>
                    <div>
                        <img src="./assets/img/burger/burger-made-from-vegetables-and-beef.jpg">
                    </div>
                    <div>
                        <h3>Überschrift</h3>
                        <p>Beschreibung</p>
                    </div>
                    <div class="price-and-button-wrapper">
                        <p>Price</p>
                        <button>Add to basket</button>
                    </div>
                </article>
            </div>
        </section>
        <section>
            <div class="section-header">
                <div class="img-wrapper">
                    <img class="section-img" src="./assets/img/pizza/pizza_icon.png">
                </div>
                <div class="header-wrapper">
                    <h2>Pizza (30cm)</h2>
                </div>
            </div>
            <div class="articles-wrapper">
                <article>

                </article>
            </div>
        </section>
        <section>
            <div class="section-header">
                <div class="img-wrapper">
                    <img class="section-img" src="./assets/img/salad/salad_icon.png">
                </div>
                <div class="header-wrapper">
                    <h2>Salad</h2>
                </div>
            </div>
            <div class="articles-wrapper">
                <article>

                </article>
            </div>
        </section>
    </main>
    <footer>
        <div class="footer-link-wrapper">
            <div>
                <p>© 2026 BurgerHouse</p>
            </div>
            <div>
                <p>Imprint</p>
            </div>
            <div>
                <p> Cookie Preferences</p>
            </div>
        </div>
    </footer>
    <script src="script.js"></script>
    <script src="food-db.js"></script>
</body>
</html>

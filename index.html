<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bestell App</title>
    <script src="./assets/templates/template.js"></script>

    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/34f6182fea.js" crossorigin="anonymous"></script>

</head>
<body onload="init()">
    <header>
        <nav>
            <div class="nav-logo">
                <img src="./assets/img/icon.png">
            </div>
            <div class="burger-menu-button pointer">
                <i class="fa-solid fa-bars"></i>
            </div>
        </nav>
        <div class="hero-banner-container">
            <img class="hero-banner-img" src="./assets/img/hero_banner.jpg">
        </div>
        <div class="header-infos-wrapper">
            <div class="burger-header-logo">
                <img class="burger-logo" src="./assets/img/burger/burger_logo.png">
            </div>
            <div class="header-infos">
                <div class="headline-rating-wrapper">
                    <div class="headline">
                        <span class="header1">Burger</span>
                        <p>House</p>
                    </div>
                    <div class="rating">
                        <p><i class="fa-solid fa-star"></i> 4,1 (317)</p>
                    </div>
                </div>
                <div class="info">
                    <p>The best of Burgers, Pizza and Greens, all in one great place.</p>
                </div>
            </div>
        </div>
    </header>
    <div class="content-layout">
        <main id="content">
        </main>

        <aside id="basket-wrapper">
            
        </aside>
    </div>
    <footer>
        <div class="footer-link-wrapper">
            <div>
                <p>© 2026 BurgerHouse</p>
            </div>
            <div>
                <p>Imprint</p>
            </div>
            <div>
                <p> Cookie Preferences</p>
            </div>
        </div>
    </footer>
    <script src="./food-db.js"></script>
    <script src="./script.js"></script>
</body>
</html>
